<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>domain-agent for chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 160px;
      display: flex;
      flex-direction: column;
      padding: 48px 20px 16px;
      -webkit-app-region: drag;
      gap: 12px;
    }
    #status {
      font-size: 13px;
      color: #aaa;
      min-height: 20px;
    }
    #status.active { color: #4ade80; }
    #dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      margin-right: 8px;
      vertical-align: middle;
    }
    #dot.active { background: #4ade80; }
    .hint {
      font-size: 11px;
      color: #444;
    }
  </style>
</head>
<body>
  <div id="status"><span id="dot"></span><span id="msg">시작 중...</span></div>
  <div class="hint">ChatGPT · Claude.ai 대화가 자동으로 domain-agent에 학습됩니다</div>
  <script src="app.js"></script>
</body>
</html>
